[package]
publish = false
name = "teamy-vox-afl"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "0.18"
vox = { package = "teamy-vox", path = "../../rust/vox" }
vox-core = { package = "teamy-vox-core", path = "../../rust/vox-core" }
vox-types = { package = "teamy-vox-types", path = "../../rust/vox-types" }
spec-proto = { package = "teamy-vox-proto", path = "../../spec/spec-proto" }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[[bin]]
name = "protocol_decode"
path = "src/bin/protocol_decode.rs"

[[bin]]
name = "testbed_mem_session"
path = "src/bin/testbed_mem_session.rs"

[[bin]]
name = "protocol_decode_repro"
path = "src/bin/protocol_decode_repro.rs"
