[workspace]
resolver = "2"
members = [
  "rust-examples",
  "xtask",
  "spec/spec-proto",
  "spec/spec-tests",
  "rust/vox-types",
  "rust/vox-rt",
  "rust/vox-rt-macros",
  "rust/vox-schema",
  "rust/vox-core",
  "rust/vox-iroh",
  "rust/vox-stream",
  "rust/vox-websocket",
  "rust/vox-inprocess",
  "rust/vox-local",
  "rust/vox-fdpass",
  "rust/vox-ffi",
  "rust/ur-taking-me-with-you",
  "rust/vox-macros-parse",
  "rust/vox-macros-core",
  "rust/vox-macros",
  "rust/vox",
  "rust/subject-rust",
  "rust/vox-codegen",
  "rust/vox-phon",
  "rust/wasm-browser-tests",
  "rust/wasm-inprocess-tests",
  "typescript/peer-server",
]
exclude = ["fuzz", "phon"]

[workspace.package]
version = "0.10.0-rc.5"
edition = "2024"
rust-version = "1.92"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TeamDman/vox"
homepage = "https://github.com/TeamDman/vox"
documentation = "https://docs.rs/vox"
keywords = ["rpc", "ipc", "serde", "networking"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
# Internal crates
vox = { package = "teamy-vox", path = "rust/vox", version = "=0.10.0-rc.7" }
vox-types = { package = "teamy-vox-types", path = "rust/vox-types", version = "=0.10.0-rc.7" }
vox-rt = { package = "teamy-vox-rt", path = "rust/vox-rt", version = "=0.10.0-rc.7" }
vox-rt-macros = { package = "teamy-vox-rt-macros", path = "rust/vox-rt-macros", version = "=0.10.0-rc.7" }
vox-schema = { package = "teamy-vox-schema", path = "rust/vox-schema", version = "=0.10.0-rc.7" }
vox-macros-parse = { package = "teamy-vox-macros-parse", path = "rust/vox-macros-parse", version = "=0.10.0-rc.7" }
vox-macros-core = { package = "teamy-vox-macros-core", path = "rust/vox-macros-core", version = "=0.10.0-rc.7" }
vox-service-macros = { package = "teamy-vox-service-macros", path = "rust/vox-macros", version = "=0.10.0-rc.7" }
vox-core = { package = "teamy-vox-core", path = "rust/vox-core", version = "=0.10.0-rc.7" }
vox-stream = { package = "teamy-vox-stream", path = "rust/vox-stream", version = "=0.10.0-rc.7" }
vox-fdpass = { package = "teamy-vox-fdpass", path = "rust/vox-fdpass", version = "=0.10.0-rc.7" }
vox-codegen = { package = "teamy-vox-codegen", path = "rust/vox-codegen", version = "=0.10.0-rc.7" }
vox-websocket = { package = "teamy-vox-websocket", path = "rust/vox-websocket", version = "=0.10.0-rc.7" }
vox-inprocess = { package = "teamy-vox-inprocess", path = "rust/vox-inprocess", version = "=0.10.0-rc.7" }
vox-iroh = { package = "teamy-vox-iroh", path = "rust/vox-iroh", version = "=0.10.0-rc.5" }
vox-local = { package = "teamy-vox-local", path = "rust/vox-local", version = "=0.10.0-rc.7" }
vox-ffi = { package = "teamy-vox-ffi", path = "rust/vox-ffi", version = "=0.10.0-rc.7" }
subject-rust = { path = "rust/subject-rust", version = "0.2.2" }
spec-proto = { package = "teamy-vox-proto", path = "spec/spec-proto", version = "=0.2.2" }
vox-phon = { package = "teamy-vox-phon", path = "rust/vox-phon", version = "=0.10.0-rc.7" }

phon = { path = "phon/rust/phon", package = "teamy-phon", version = "=0.2.0-rc.5" }
phon-engine = { path = "phon/rust/phon-engine", package = "teamy-phon-engine", version = "=0.2.0-rc.5" }
phon-ir = { path = "phon/rust/phon-ir", package = "teamy-phon-ir", version = "=0.2.0-rc.5" }
phon-schema = { path = "phon/rust/phon-schema", package = "teamy-phon-schema", version = "=0.2.0-rc.5" }
phon-jit = { path = "phon/rust/phon-jit", package = "teamy-phon-jit", version = "=0.2.0-rc.5" }
phon-codegen = { path = "phon/rust/phon-codegen", package = "teamy-phon-codegen", version = "=0.2.0-rc.5" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws"] }
bitflags = "2.11.0"
structstruck = "0.5.1"
bytes = "1"
blake3 = "1.8"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "io-util"] }
parking_lot = "0.12"
wasmtimer = { version = "0.4", default-features = false }
tokio-tungstenite = "0.29"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
libc = "0.2.180"
tempfile = "3.23"
xshell = "0.2"
passfd = "0.1"

# facet ecosystem
facet = { package = "teamy-facet", version = "=0.50.0-rc.7", features = ["camino", "reflect"] }
facet-core = { package = "teamy-facet-core", version = "=0.50.0-rc.7" }
facet-path = { package = "teamy-facet-path", version = "=0.50.0-rc.7" }
facet-reflect = { package = "teamy-facet-reflect", version = "=0.50.0-rc.7" }
facet-pretty = { package = "teamy-facet-pretty", version = "=0.50.0-rc.7", default-features = false }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.9" }
facet-value = { package = "teamy-facet-value", version = "=0.50.0-rc.9" }
facet-testhelpers = { package = "teamy-facet-testhelpers", version = "=0.50.0-rc.7" }

# Futures utilities
futures-channel = "0.3"
futures-util = "0.3"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

indexmap = "2"
iroh = "1.0.2"
smallvec = "1.15.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
zerocopy = { version = "0.8", features = ["derive"] }

figue = { package = "teamy-figue", version = "=6.0.0-rc.5" }
prettyplease = "0.2"
insta = "1"
unsynn = "0.3"
windows-sys = "0.61"
eyre = "0.6"


[profile.release]
debug = 1

[profile.bench]
debug = 1

[profile.samply]
inherits = "release"
debug = true
